name: Import verified game cover images
on:
  workflow_dispatch:
  push:
    paths:
      - cover_sources.json
      - scripts/sync_covers.py
      - .github/workflows/import-covers.yml
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow beautifulsoup4
      - run: python scripts/sync_covers.py
      - name: Commit cover images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/covers/
          if ! git diff --staged --quiet; then
            git commit -m "Import verified product cover artwork from Wake Tech LibGuide"
            git push
          fi
