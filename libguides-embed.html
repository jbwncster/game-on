<!-- Game On! native LibGuides widget: no iframe. Under 2,000 characters. -->
<div id="game-on-embed">
  <p><strong>🎲 Game On! — Eastern Wake Library</strong></p>
  <p>Browse our 28 games, puzzles and LEGO items. 3-hour reserve; ask the front desk.</p>
  <p><a href="https://game-on-flame.vercel.app/" target="_blank" rel="noopener noreferrer">Open the live game availability tracker</a></p>
</div>
<script>
(function(){
function addWidget(){
var target=document.getElementById("game-on-embed");
if(!target||target.dataset.ready)return;
target.dataset.ready="1";
var s=document.createElement("script");
s.src="https://game-on-flame.vercel.app/static/embed.js";
s.async=true;
s.onerror=function(){target.insertAdjacentHTML("beforeend","<p>Availability cannot load here. Please open the full tracker using the link above.</p>");};
document.head.appendChild(s);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",addWidget);
else addWidget();
})();
</script>
